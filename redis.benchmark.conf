# Redis config for benchmark runs.
#
# Differs from redis.conf in two deliberate ways:
#
# 1. `databases 64` -- worker isolation uses one logical DB per worker (REDIS_DB=<slot>),
#    because Memora's keys carry no user namespace. The default of 16 caps parallelism at
#    16 workers; 64 leaves headroom for the 32-core box.
#
# 2. Persistence is OFF. Benchmark memories are disposable intermediate state, rebuilt
#    from locomo10.json on any re-run. AOF fsync on every write would add I/O latency to
#    the hot ingest path and gigabytes of churn to ./data/redis for no benefit.
#    Use the stock redis.conf if you want a durable store.

databases 64

# No persistence - this is scratch state.
appendonly no
save ""

# Benchmark stores are small (thousands of hashes per DB); do not evict mid-run, because
# a silent eviction looks exactly like a recall failure.
maxmemory-policy noeviction

loglevel notice

# Long ingest runs with idle QA gaps; do not drop client connections.
timeout 0
tcp-keepalive 300
