# Redis configuration for memory system
# Enable AOF (Append Only File) for persistence

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Save snapshots (backup to AOF)
save 900 1
save 300 10
save 60 10000
